version: 2
updates:
  # Weekly update PRs; CI checks each one before you merge. Security fixes also arrive outside this schedule
  # once Dependabot security updates are switched on in Settings -> Code security.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node must match the Node major the site runs on (Vercel project setting); newer typings let code use
      # APIs that do not exist at runtime. Bump it by hand together with the Node version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
